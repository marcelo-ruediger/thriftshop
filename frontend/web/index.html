<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Wird von `flutter build web --base-href` ersetzt -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thriftshop Köln – Second-Hand-Mode, Möbel und Fundstücke mit Abholung im Laden. Portfolio-Projekt mit Flutter und FastAPI.">
  <meta name="theme-color" content="#FAF7F2">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thriftshop Köln">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Thriftshop Köln</title>

  <!-- Ladeanzeige, bis Flutter das erste Bild gezeichnet hat -->
  <style>
    html, body { height: 100%; margin: 0; background: #FAF7F2; }
    #start {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      font: 500 15px system-ui, sans-serif; color: #5E6862;
    }
    #start img { width: 96px; height: 96px; }
    #start .kreis {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #DCEEE7; border-top-color: #2F6F5E;
      animation: drehen 0.9s linear infinite;
    }
    @keyframes drehen { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #start .kreis { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="start" role="status" aria-label="Thriftshop Köln wird geladen">
    <img src="favicon.svg" alt="">
    <div class="kreis"></div>
  </div>
  <script>
    // Flutter meldet das erste gezeichnete Bild - dann verschwindet die Ladeanzeige
    window.addEventListener('flutter-first-frame', function () {
      var start = document.getElementById('start');
      if (start) start.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
