name: thriftshop_koeln
description: "Flutter-Frontend für den Thriftshop Köln."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.4.0
  file_picker: ^8.1.7
  go_router: ^17.2.2
  google_fonts: ^8.1.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/bilder/
